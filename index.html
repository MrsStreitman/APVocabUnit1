<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Global Tapestry — AP World Unit 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141830;
  --surface:#1E2444;
  --surface-2:#262E52;
  --edge:#333C69;
  --text:#F1ECE1;
  --muted:#9AA2C8;
  --gold:#E8A33D;
  --jade:#57C295;
  --rose:#E2716B;
  --tick-off:#2E3660;
  --shadow:0 12px 32px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EFF1F7;
    --surface:#FFFFFF;
    --surface-2:#F3F5FB;
    --edge:#D5DAE8;
    --text:#1A1F38;
    --muted:#5C6584;
    --gold:#B3762A;
    --jade:#2E8F66;
    --rose:#C4473F;
    --tick-off:#D5DAE8;
    --shadow:0 10px 26px rgba(26,31,56,.10);
  }
}
:root[data-theme="light"]{
  --bg:#EFF1F7; --surface:#FFFFFF; --surface-2:#F3F5FB; --edge:#D5DAE8;
  --text:#1A1F38; --muted:#5C6584; --gold:#B3762A; --jade:#2E8F66; --rose:#C4473F;
  --tick-off:#D5DAE8; --shadow:0 10px 26px rgba(26,31,56,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:660px;margin:0 auto;padding:18px 16px 40px}

/* ---- masthead ---- */
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.mast h1{
  font-family:"Newsreader",Georgia,serif;
  font-weight:500;font-size:1.45rem;letter-spacing:-.01em;margin:0;
}
.mast p{margin:2px 0 0;font-size:.78rem;color:var(--muted)}
.themebtn{
  background:none;border:1px solid var(--edge);color:var(--muted);
  border-radius:999px;padding:5px 11px;font:inherit;font-size:.72rem;cursor:pointer;flex:none;
}

/* ---- the shrinking pile ---- */
.rail{background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:12px 13px;margin-bottom:14px}
.ticks{display:flex;flex-wrap:wrap;gap:3px}
.tick{width:9px;height:14px;border-radius:2px;background:var(--tick-off);transition:background .25s ease}
.tick.learning{background:var(--gold);opacity:.45}
.tick.warm{background:var(--gold);opacity:.8}
.tick.done{background:var(--jade)}
.railfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.78rem;color:var(--muted)}
.railfoot b{color:var(--text);font-weight:600}

/* ---- controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{
  border:1px solid var(--edge);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:8px 13px;font:inherit;font-size:.82rem;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
select{
  width:100%;background:var(--surface);color:var(--text);border:1px solid var(--edge);
  border-radius:10px;padding:10px 12px;font:inherit;font-size:.85rem;margin-bottom:14px;
}

/* ---- card ---- */
.card{
  background:var(--surface);border:1px solid var(--edge);border-radius:18px;
  box-shadow:var(--shadow);padding:22px 20px;min-height:270px;
  display:flex;flex-direction:column;
}
.cardhead{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:16px}
.prompt{flex:1;display:flex;align-items:center}
.term{
  font-family:"Newsreader",Georgia,serif;font-weight:600;
  font-size:2rem;line-height:1.15;letter-spacing:-.015em;margin:0;
}
.def{font-size:1.02rem;line-height:1.55;margin:0;max-width:62ch}
.reveal{border-top:1px solid var(--edge);margin-top:18px;padding-top:16px}
.reveal .term{font-size:1.4rem;margin-bottom:8px}
.reveal .def{font-size:.95rem;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted);margin-top:14px}

/* ---- buttons ---- */
.row{display:flex;gap:9px;margin-top:14px}
.btn{
  flex:1;border:1px solid var(--edge);background:var(--surface-2);color:var(--text);
  border-radius:13px;padding:15px 12px;font:inherit;font-size:.95rem;font-weight:600;cursor:pointer;
}
.btn:active{transform:translateY(1px)}
.btn.flip{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.yes{border-color:var(--jade);color:var(--jade)}
.btn.no{border-color:var(--rose);color:var(--rose)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{
  text-align:left;border:1px solid var(--edge);background:var(--surface-2);color:var(--text);
  border-radius:12px;padding:13px 14px;font:inherit;font-size:.9rem;line-height:1.45;cursor:pointer;
}
.opt.right{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 14%,var(--surface-2))}
.opt.wrong{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,var(--surface-2))}
input[type=text]{
  width:100%;background:var(--surface-2);border:1px solid var(--edge);color:var(--text);
  border-radius:12px;padding:14px;font-family:"Newsreader",Georgia,serif;font-size:1.15rem;margin-top:16px;
}
input[type=text]:focus,.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,select:focus-visible,.themebtn:focus-visible,.link:focus-visible{
  outline:2px solid var(--gold);outline-offset:2px
}
.verdict{margin-top:14px;font-size:.9rem;font-weight:600}
.verdict.ok{color:var(--jade)}
.verdict.near{color:var(--gold)}
.verdict.no{color:var(--rose)}
.verdict span{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:3px}

/* ---- footer ---- */
.foot{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:22px}
.link{background:none;border:none;color:var(--muted);font:inherit;font-size:.78rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
.empty{text-align:center;padding:30px 10px}
.empty h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:1.5rem;margin:0 0 8px}
.empty p{color:var(--muted);font-size:.9rem;margin:0}
dialog{
  background:var(--surface);color:var(--text);border:1px solid var(--edge);border-radius:16px;
  max-width:520px;width:calc(100% - 32px);padding:20px;box-shadow:var(--shadow);
}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:1.2rem;margin:0 0 12px}
.retlist{max-height:46vh;overflow-y:auto;margin:0 0 14px;padding:0;list-style:none}
.retlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--edge);font-size:.88rem}
@media (max-width:420px){ .term{font-size:1.7rem} .tick{width:8px;height:13px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div>
      <h1>The Global Tapestry</h1>
      <p>AP World History, Unit 1 &nbsp;·&nbsp; 1200–1450 &nbsp;·&nbsp; 81 terms</p>
    </div>
    <button class="themebtn" id="themebtn">Light</button>
  </header>

  <section class="rail">
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <div class="railfoot">
      <span><b id="doneCount">0</b> retired · <b id="leftCount">81</b> still in the pile</span>
      <span id="topicLabel">All topics</span>
    </div>
  </section>

  <div class="controls" role="group" aria-label="Study mode">
    <button class="chip" data-mode="flip" aria-pressed="true">Flashcards</button>
    <button class="chip" data-mode="t2d" aria-pressed="false">Pick the definition</button>
    <button class="chip" data-mode="d2t" aria-pressed="false">Pick the term</button>
    <button class="chip" data-mode="type" aria-pressed="false">Type the term</button>
  </div>

  <select id="topic" aria-label="Filter by topic"></select>

  <main id="stage"></main>

  <div class="foot">
    <button class="link" id="showRetired">Retired terms</button>
    <button class="link" id="resetBtn">Start over</button>
  </div>
</div>

<dialog id="retDlg">
  <h2>Retired terms</h2>
  <ul class="retlist" id="retList"></ul>
  <div class="row">
    <button class="btn" id="bringAll">Bring them all back</button>
    <button class="btn flip" id="closeDlg">Close</button>
  </div>
</dialog>

<script>
/* ============ VOCABULARY ============ */
const TOPICS = {
  "1.1":"1.1 Developments in East Asia",
  "1.2":"1.2 Developments in Dar al-Islam",
  "1.3":"1.3 South and Southeast Asia",
  "1.4":"1.4 State Building in the Americas",
  "1.5":"1.5 State Building in Africa",
  "1.6":"1.6 Developments in Europe"
};
const VOCAB = [
{n:1,tp:"1.1",t:"Song Dynasty",d:"A Chinese dynasty that ruled from 960–1279. It was a leading example of diversity and innovation in Afro-Eurasia, using traditional methods of Confucianism and an imperial bureaucracy to maintain and justify its rule."},
{n:2,tp:"1.1",t:"Imperial Bureaucracy",d:"A vast organization in which appointed officials carry out the empire's policies. Song China's strength was partially due to this imperial bureaucracy."},
{n:3,tp:"1.1",t:"Meritocracy",d:"China's bureaucratic system under the Song Dynasty, where officials obtained their positions by demonstrating their merit through scoring well on civil service exams based on knowledge of Confucian texts."},
{n:4,tp:"1.1",t:"Grand Canal",d:"An inexpensive and efficient internal waterway transportation system in China, extended to over 30,000 miles. Expanding it under the Song Dynasty made China the most populous trading area in the world."},
{n:5,tp:"1.1",t:"Proto-industrialization",d:"A set of economic changes in China, preceding later industrialization, where people in rural areas produced more goods than they could sell. Unlike factory-based industrialization, this relied on home-based or community-based production using simple equipment."},
{n:6,tp:"1.1",t:"Artisan",d:"Skilled craftworkers who, for example, produced steel and other products in widely dispersed smelting facilities under the supervision of the imperial government during Song proto-industrialization."},
{n:7,tp:"1.1",t:"Scholar-gentry",d:"A new social class created by the bureaucratic expansion in China, which outnumbered the aristocracy and consisted of landowners who earned their wealth."},
{n:8,tp:"1.1",t:"Filial piety",d:"A key aspect of Chinese cultural traditions, emphasizing respect for and expected deference from women, and influencing East Asia."},
{n:9,tp:"1.1",t:"Foot binding",d:"A social practice categorized under Chinese cultural traditions, particularly in discussions of social structures and gender roles."},
{n:10,tp:"1.1",t:"Buddhism",d:"A belief system originating in India that continued to shape societies in Asia and included various branches, schools, and practices. Its core beliefs influenced neighboring regions due to Chinese cultural traditions."},
{n:11,tp:"1.1",t:"Theravada Buddhism",d:"A branch of Buddhism that focused on personal spiritual growth through silent meditation and self-discipline, becoming strongest in Southeast Asia."},
{n:12,tp:"1.1",t:"Mahayana Buddhism",d:"A branch of Buddhism that focused on spiritual growth for all beings and on service, becoming strongest in China and Korea."},
{n:13,tp:"1.1",t:"Tibetan Buddhism",d:"A branch of Buddhism that focused on chanting, becoming the strongest in Tibet."},
{n:14,tp:"1.1",t:"Chan Buddhism (Zen Buddhism)",d:"A syncretic branch of Buddhism that combined elements of Daoist traditions with Buddhism, emphasizing direct experience and meditation. It was popular among ordinary Chinese citizens and became very popular in monasteries."},
{n:15,tp:"1.1",t:"Neo-Confucianism",d:"A syncretic belief system that combined rational thought with the more abstract ideas of Daoism and Buddhism. It gained popularity during the Tang and Song dynasties and influenced Japan, Korea, and Vietnam."},
{n:16,tp:"1.1",t:"Daoism",d:"A Chinese philosophical tradition that emphasizes harmony with nature and inner reflection."},
{n:17,tp:"1.1",t:"Shogun",d:"In Japan, a military general who had little real power compared to the emperor, but whose role and the loyalty of the samurai created political decentralization."},
{n:18,tp:"1.1",t:"Samurai",d:"Warriors who pledged loyalty to a daimyo in return for land. They embodied the code of bushido."},
{n:19,tp:"1.1",t:"Bushido",d:"A code of chivalry, courage, and loyalty followed by the samurai in Japan."},
{n:20,tp:"1.1",t:"Daimyo",d:"Powerful Japanese landowning aristocrats who controlled land and were served by samurai."},
{n:21,tp:"1.1",t:"Champa rice",d:"A fast-ripening and drought-resistant strain of rice from Vietnam that significantly increased agricultural productivity in Song China and contributed to its population growth."},
{n:22,tp:"1.1",t:"Steel and iron production",d:"Significant manufacturing innovations in Song China, expanding for export alongside textiles and porcelains."},
{n:23,tp:"1.1",t:"Textiles and porcelains for export",d:"Major manufactured goods produced in Song China for trade, indicating a commercialized economy and increased productive capacity."},
{n:24,tp:"1.2",t:"Dar al-Islam",d:"The term referring to areas where Islam is prevalent or where Muslims are in the majority."},
{n:25,tp:"1.2",t:"Seljuk Turks",d:"Nomadic Turkic peoples from Central Asia who challenged the Abbasid Empire and established their own Sultanate, leading to new Islamic political entities."},
{n:26,tp:"1.2",t:"Sultan",d:"A ruler, particularly used by the Seljuk Turks, who reduced the role of the highest-ranking Abbasid caliph from caliph to sultan, suggesting a shift in political authority."},
{n:27,tp:"1.2",t:"Mamluk Sultanate",d:"A new Islamic political entity in Egypt, formed by Mamluks (enslaved Arabs, often of Turkic origin) who overthrew their Abbasid rulers. They maintained power by facilitating trade in cotton and sugar between the Middle East and Europe."},
{n:28,tp:"1.2",t:"Crusades",d:"European military campaigns to regain the Holy Land. The Abbasids used this term when describing challenges from the West."},
{n:29,tp:"1.2",t:"Baghdad",d:"The Abbasid capital city, which suffered from economic decline after trade patterns shifted away from it and infrastructure fell into disrepair. It was also home to the House of Wisdom."},
{n:30,tp:"1.2",t:"House of Wisdom",d:"A renowned center of learning in Abbasid Baghdad, which translated major Greek philosophical and medical works into Arabic."},
{n:31,tp:"1.2",t:"Sufis",d:"Mystical Muslim missionaries who played a significant role in spreading Islam, appealing to individuals outside conventional religious traditions by stressing personal devotion to God and reducing emphasis on rituals."},
{n:32,tp:"1.2",t:"Diaspora",d:"The scattering of a people from their homeland. Muslim merchant communities settled in Indian port cities, forming diasporic communities and influencing cultural traditions."},
{n:33,tp:"1.2",t:"Jizya",d:"A tax levied on non-Muslim subjects in Islamic states."},
{n:34,tp:"1.2",t:"Nasir al-Din al-Tusi (1201–1274)",d:"A celebrated Islamic scholar who made significant advances in mathematics, astronomy, law, logic, ethics, philosophy, and medicine. His work greatly influenced cartography."},
{n:35,tp:"1.2",t:"'A'ishah al-Ba'uniyyah (1460–1507)",d:"A prominent female Muslim poet and Sufi mystic, whose poetry reflected clear descriptions of Sufi introspection and her spiritual journey."},
{n:36,tp:"1.2",t:"Delhi Sultanates",d:"New Islamic political entities established in Northern India, maintaining power for over 400 years (13th to 16th centuries)."},
{n:37,tp:"1.3",t:"Rajput kingdoms",d:"Hindu states that emerged in Northern India after the fall of the Gupta Empire, characterized by decentralization and frequent warfare, allowing for easy Muslim invasions."},
{n:38,tp:"1.3",t:"Delhi Sultanate",d:"A Muslim political structure established in Northern India after the invasions by Muslim forces, maintaining power for over 400 years (13th–16th centuries). They struggled to extend their rule into South India due to strong resistance."},
{n:39,tp:"1.3",t:"Proselytize",d:"To actively seek to convert others to one's religion. Islam is described as a universalizing religion that sought to proselytize and convert others, including Hindus and Buddhists in India."},
{n:40,tp:"1.3",t:"Caste system",d:"A hierarchical social structure fundamental to Hinduism, which organized society into defined classes. Low-caste Hindus sometimes converted to Islam to improve their social status."},
{n:41,tp:"1.3",t:"Qutub Minar",d:"A massive Islamic architectural tower in Delhi, built by the Delhi Sultanate using materials from Hindu temples and shrines, symbolizing either Islamic influence or dominance in Northern India."},
{n:42,tp:"1.3",t:"Urdu",d:"A new language that developed in South Asia as a result of the cultural blending between Muslims and Hindus, combining elements of Sanskrit-based Hindu languages with Arabic and Persian."},
{n:43,tp:"1.3",t:"Bhakti Movement",d:"A Hindu mystical movement that emerged in the 12th century, emphasizing emotion and personal devotion to a specific deity over rituals and sacred texts. It was popular due to its inclusivity toward women and lower social statuses and shared similarities with Sufi Islam."},
{n:44,tp:"1.3",t:"Srivijaya Empire (670–1025)",d:"A Hindu kingdom based on Sumatra, which built its navy and prospered by controlling sea routes."},
{n:45,tp:"1.3",t:"Majapahit (1293–1520)",d:"A Buddhist kingdom on Java that controlled sea routes, allowing it to sustain its power."},
{n:46,tp:"1.3",t:"Khmer Empire (802–1431)",d:"A Hindu-Buddhist state in Southeast Asia (present-day Cambodia), centered on the Mekong River. It prospered due to complex irrigation and drainage systems. Its capital, Angkor Thom, featured Hindu artwork and Buddhist sculptures, demonstrating religious syncretism."},
{n:47,tp:"1.3",t:"Buddhist monasticism",d:"The practice of monks and nuns living in monasteries. It was disorganized in India due to corruption among monks and raids by early Muslim conquerors, contributing to the decline of Buddhism."},
{n:48,tp:"1.3",t:"Vijayanagara Empire (1336–1646)",d:"A powerful Hindu state in South India, politically centralized, and controlling most of South India. Its founders, Harihara and Bukka, reverted to Hinduism after being part of the Delhi Sultanate."},
{n:49,tp:"1.3",t:"Sukhothai kingdom",d:"A Hindu/Buddhist state in Southeast Asia (present-day Thailand). The rulers constructed an ornate and majestic Buddhist temple complex of Angkor Wat in 1431, forcing the Khmers out."},
{n:50,tp:"1.3",t:"Sinhala dynasties",d:"Hindu/Buddhist states in Southeast Asia (Sri Lanka). Buddhist priests played a role in advising the monarchs on the construction of irrigation systems and networks of canals."},
{n:51,tp:"1.4",t:"Matrilineal society",d:"A social system where inheritance and social standing are traced through the mother's side of the family. The Mississippian culture, exemplified by Cahokia, was a matrilineal society."},
{n:52,tp:"1.4",t:"Cahokia",d:"The largest first-large-scale civilization in North America, located in southern Illinois. It was known for its enormous earthen mounds."},
{n:53,tp:"1.4",t:"City-state",d:"An independent city that controls its surrounding territory, a common political structure in the Americas, such as the Maya city-states."},
{n:54,tp:"1.4",t:"Theocracy",d:"A form of government in which religious leaders rule in the name of God or a deity. The Maya city-states were typically run by a theocracy."},
{n:55,tp:"1.4",t:"Mit'a system",d:"A mandatory public service system in the Inca Empire, requiring all male peasants to contribute a set number of days of labor to public works projects."},
{n:56,tp:"1.4",t:"Carpa Nan",d:"A vast roadway system developed by the Inca Empire, measuring 25,000 miles, used for military and government purposes."},
{n:57,tp:"1.4",t:"Maya city-states",d:"Politically decentralized city-states, each ruled by a king and comprising a city and its surrounding territory, frequently engaged in warfare for tribute and human sacrifices."},
{n:58,tp:"1.4",t:"Mexica (Aztec Empire)",d:"A powerful empire in Mesoamerica (central Mexico), with its capital at Tenochtitlan. It created a tributary empire, demanding tribute from conquered peoples, and was a theocracy."},
{n:59,tp:"1.4",t:"Inca",d:"A powerful empire in the Andes mountains, which created a vast centralized state and utilized the mit'a system for labor."},
{n:60,tp:"1.4",t:"Chaco",d:"A state system in the Americas, known for large, well-built stone and clay structures, including hundreds of rooms."},
{n:61,tp:"1.4",t:"Mesa Verde",d:"A state system in the Americas, known for multi-story homes built into cliffs made of sandstone."},
{n:62,tp:"1.5",t:"Kin-based networks",d:"Political structures in sub-Saharan Africa where families governed themselves. These networks were decentralized, with power held by male heads of families (chiefs) who mediated conflicts."},
{n:63,tp:"1.5",t:"Chief",d:"The male head of a kin-based network, responsible for mediating conflicts and dealing with neighboring groups."},
{n:64,tp:"1.5",t:"Hausa Kingdoms",d:"Seven states formed by the Hausa ethnic group in what is now Nigeria, often connected through kinship ties. They were loosely connected city-states, specializing in different areas, often in fertile plains where cotton grew well."},
{n:65,tp:"1.5",t:"Great Zimbabwe",d:"A large kingdom in Southeast Africa between the 12th and 15th centuries, prospering from gold mining and trade with coastal city-states. It built a massive stone wall (30 feet high, 15 feet thick) that enclosed the capital city, indicating strong political organization."},
{n:66,tp:"1.5",t:"Ethiopia",d:"A Christian kingdom in East Africa (Horn of Africa) that had connections with the Roman Empire. It adopted Christianity as its state religion and maintained its independence, growing into a powerful state."},
{n:67,tp:"1.6",t:"Feudalism",d:"A decentralized political and social system in Europe characterized by obligations between lords and vassals. Lords (landowners) granted fiefs (land) to vassals (knights) in return for military service."},
{n:68,tp:"1.6",t:"Manor",d:"Large fiefs or estates, central to the manorial system, where serfs were tied to the land."},
{n:69,tp:"1.6",t:"Manorial system",d:"An economic system in Europe where manors were largely self-sufficient, producing nearly everything they needed, thus limiting the need for trade and fostering local economies."},
{n:70,tp:"1.6",t:"Serf",d:"Peasants who were tied to the land on a manor and worked as agricultural laborers, bound to the lord's will."},
{n:71,tp:"1.6",t:"Three-field system",d:"An agricultural innovation in Europe where crops were rotated through three fields, leading to increased agricultural productivity."},
{n:72,tp:"1.6",t:"Estates-General",d:"A French advisory body to the king, composed of representatives from the three legal classes (estates): the clergy, nobility, and commoners. It typically had little power and did not tax the common people."},
{n:73,tp:"1.6",t:"Magna Carta",d:"A document signed in 1215 by King John of England, which limited the power of the king, specifically requiring him to respect certain rights."},
{n:74,tp:"1.6",t:"English Parliament",d:"A legislative body in England, formed in 1265, representing the interests of nobles and the Church, with powers that included approving new taxes."},
{n:75,tp:"1.6",t:"Hundred Years' War (1337–1453)",d:"A conflict between England and France, during which the power of the French king grew significantly."},
{n:76,tp:"1.6",t:"Reconquista",d:"The Christian reconquest of the Iberian Peninsula from Muslim rule, which ended in 1492 with the Christian forces pushing the last Muslims out of Spain."},
{n:77,tp:"1.6",t:"Great Schism",d:"A division within Christianity in 1054, separating the Roman Catholic Church and the Orthodox Church. This split deepened over time, with the Roman Catholic Church gaining more power in Western Europe."},
{n:78,tp:"1.6",t:"Antisemitism",d:"Prejudice against Jews. Increased antisemitism in Europe during this period led to the expulsion of Jews from various kingdoms."},
{n:79,tp:"1.6",t:"Renaissance",d:"A period of renewed interest in classical Greek and Roman literature, art, and culture that began in Italy around 1350 and spread throughout Europe, leading to a flourishing of art, literature, and science, and a focus on humanism."},
{n:80,tp:"1.6",t:"Humanism",d:"A key philosophical movement of the Renaissance that focused on human potential and achievements rather than religious dogma. Humanists emphasized education and a direct relationship with God over strict adherence to rituals."},
{n:81,tp:"1.6",t:"Lay Investiture Controversy",d:"A dispute between Pope Gregory VII and Holy Roman Emperor Henry IV in the 11th and 12th centuries over whether a lay leader (non-clergy) could invest bishops with symbols of their office, ultimately resolved by a compromise where church officials chose bishops but the emperor had veto power."}
];

/* ============ STORAGE ============ */
const KEY="apwh-u1-v1";
let P={};
try{ const raw=localStorage.getItem(KEY); if(raw) P=JSON.parse(raw)||{}; }catch(e){ P={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} }
function rec(n){ if(!P[n]) P[n]={s:0,r:0,w:0,ret:false}; return P[n]; }
const MASTERY=3;

/* ============ SPELLING TOLERANCE ============ */
function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[''`]/g,"").replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ").trim().replace(/^the /,"");
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function soundex(s){
  s=s.toUpperCase().replace(/[^A-Z]/g,""); if(!s) return "";
  const c={B:1,F:1,P:1,V:1,C:2,G:2,J:2,K:2,Q:2,S:2,X:2,Z:2,D:3,T:3,L:4,M:5,N:5,R:6};
  let out=s[0], prev=c[s[0]]||0;
  for(let i=1;i<s.length;i++){ const k=c[s[i]]||0;
    if(k&&k!==prev) out+=k;
    if(s[i]!=="H"&&s[i]!=="W") prev=k;
  }
  return (out+"000").slice(0,4);
}
const GENERIC=/\b(dynasty|dynasties|empire|kingdom|kingdoms|sultanate|sultanates|system|movement|society|war|controversy|production|network|networks|buddhism|piety|binding)\b/g;
function answersFor(card){
  const out=[];
  const base=card.t.replace(/\([^)]*\)/g,"").replace(/\d{3,4}\s*[–-]\s*\d{3,4}/g,"").trim();
  out.push(base);
  const paren=card.t.match(/\(([^)]+)\)/);
  if(paren && !/^\d/.test(paren[1])) out.push(paren[1].trim());
  out.push(card.t);
  const normed=out.map(norm).filter(Boolean);
  // also accept the distinctive part alone: "Song" for "Song Dynasty"
  normed.slice().forEach(t=>{
    const core=t.replace(GENERIC,"").replace(/\s+/g," ").trim();
    if(core && core!==t && core.length>=4) normed.push(core);
  });
  return [...new Set(normed)];
}
function judge(input,card){
  const a=norm(input); if(!a) return "no";
  const targets=answersFor(card);
  if(targets.includes(a)) return "exact";
  for(const t of targets){
    const tol = t.length<=6?1 : t.length<=12?2 : 3;
    if(lev(a,t)<=tol) return "near";
    const aw=a.split(" "), tw=t.split(" ");
    if(aw.length===tw.length && aw.every((w,i)=> w===tw[i] || lev(w,tw[i])<=1 || soundex(w)===soundex(tw[i]))) return "near";
    if(soundex(a.replace(/ /g,""))===soundex(t.replace(/ /g,"")) && Math.abs(a.length-t.length)<=3) return "near";
  }
  return "no";
}

/* ============ STATE ============ */
let mode="flip", topic="all", current=null, lastId=null, flipped=false, answered=false;
const $=id=>document.getElementById(id);
const stage=$("stage");

function pool(){ return VOCAB.filter(c=> topic==="all"||c.tp===topic ); }
function active(){ return pool().filter(c=> !rec(c.n).ret ); }

function pick(){
  const list=active();
  if(!list.length) return null;
  const weighted=[];
  for(const c of list){
    const r=rec(c.n);
    let w = 3 + r.w*3 - r.s*1.2 + (r.r+r.w===0?1.5:0);
    if(c.n===lastId && list.length>1) w=0.2;
    weighted.push([c,Math.max(0.4,w)]);
  }
  const total=weighted.reduce((s,[,w])=>s+w,0);
  let roll=Math.random()*total;
  for(const [c,w] of weighted){ roll-=w; if(roll<=0) return c; }
  return list[0];
}

function mark(correct,card){
  const r=rec(card.n);
  if(correct){ r.r++; r.s++; if(r.s>=MASTERY) r.ret=true; }
  else{ r.w++; r.s=0; }
  save(); paintRail();
}

/* ============ RAIL ============ */
function paintRail(){
  const list=pool();
  const el=$("ticks"); el.innerHTML="";
  let done=0;
  for(const c of list){
    const r=rec(c.n);
    const d=document.createElement("div");
    d.className="tick"+(r.ret?" done":r.s>=2?" warm":r.s===1?" learning":"");
    if(r.ret) done++;
    el.appendChild(d);
  }
  $("doneCount").textContent=done;
  $("leftCount").textContent=list.length-done;
  $("topicLabel").textContent = topic==="all"?"All topics":TOPICS[topic];
}

/* ============ RENDER ============ */
function head(card){
  return `<div class="cardhead"><span>#${card.n}</span><span>${TOPICS[card.tp]}</span></div>`;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function distractors(card,n){
  let same=VOCAB.filter(c=>c.tp===card.tp&&c.n!==card.n);
  let rest=VOCAB.filter(c=>c.tp!==card.tp);
  const picks=shuffle(same).slice(0,n);
  if(picks.length<n) picks.push(...shuffle(rest).slice(0,n-picks.length));
  return picks;
}

function render(){
  paintRail();
  current=pick(); flipped=false; answered=false;
  if(!current){
    stage.innerHTML=`<div class="card"><div class="empty">
      <h2>Pile's empty</h2>
      <p>Everything in this filter is retired. Switch topics, or bring some terms back from the retired list below.</p>
    </div></div>`;
    return;
  }
  if(mode==="flip") renderFlip();
  else if(mode==="type") renderType();
  else renderChoice();
}

function renderFlip(){
  const c=current;
  stage.innerHTML=`<div class="card">${head(c)}
    <div class="prompt"><h2 class="term">${c.t}</h2></div>
    <div class="hint">Say it out loud, then check yourself.</div>
    <div class="row"><button class="btn flip" id="flipBtn">Show definition</button></div>
  </div>`;
  $("flipBtn").onclick=()=>{
    flipped=true;
    stage.innerHTML=`<div class="card">${head(c)}
      <div class="prompt"><p class="def">${c.d}</p></div>
      <div class="reveal"><h2 class="term">${c.t}</h2></div>
      <div class="row">
        <button class="btn no" id="noBtn">Needs work</button>
        <button class="btn yes" id="yesBtn">Got it</button>
      </div>
      <div class="row"><button class="link" id="retireNow" style="flex:1">Retire this one — she knows it cold</button></div>
    </div>`;
    $("yesBtn").onclick=()=>{ mark(true,c); lastId=c.n; render(); };
    $("noBtn").onclick=()=>{ mark(false,c); lastId=c.n; render(); };
    $("retireNow").onclick=()=>{ rec(c.n).ret=true; rec(c.n).s=MASTERY; save(); lastId=c.n; render(); };
  };
}

function renderChoice(){
  const c=current, t2d = mode==="t2d";
  const opts=shuffle([c,...distractors(c,3)]);
  stage.innerHTML=`<div class="card">${head(c)}
    <div class="prompt">${ t2d ? `<h2 class="term">${c.t}</h2>` : `<p class="def">${c.d}</p>` }</div>
    <div class="opts" id="opts"></div>
  </div>`;
  const box=$("opts");
  opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="opt";
    b.textContent = t2d ? o.d : o.t;
    b.onclick=()=>{
      if(answered) return; answered=true;
      const right = o.n===c.n;
      b.classList.add(right?"right":"wrong");
      if(!right) [...box.children].forEach((el,i)=>{ if(opts[i].n===c.n) el.classList.add("right"); });
      mark(right,c); lastId=c.n;
      const next=document.createElement("button");
      next.className="btn flip"; next.textContent="Next card"; next.style.marginTop="14px";
      next.onclick=render;
      box.parentElement.appendChild(next);
      next.focus();
    };
    box.appendChild(b);
  });
}

function renderType(){
  const c=current;
  stage.innerHTML=`<div class="card">${head(c)}
    <div class="prompt"><p class="def">${c.d}</p></div>
    <input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the term">
    <div id="verdict"></div>
    <div class="row"><button class="btn flip" id="checkBtn">Check answer</button></div>
    <div class="hint">Close spellings count. Sound it out.</div>
  </div>`;
  const input=$("ans");
  input.focus();
  const check=()=>{
    if(answered) return;
    const v=judge(input.value,c);
    answered=true;
    const vd=$("verdict");
    if(v==="exact"){ vd.innerHTML=`<div class="verdict ok">Correct.</div>`; mark(true,c); }
    else if(v==="near"){ vd.innerHTML=`<div class="verdict near">Close enough — counted.<span>Spelled: ${c.t}</span></div>`; mark(true,c); }
    else{ vd.innerHTML=`<div class="verdict no">Not quite.<span>Answer: ${c.t}</span></div>`; mark(false,c); }
    lastId=c.n;
    const btn=$("checkBtn"); btn.textContent="Next card"; btn.onclick=render; btn.focus();
  };
  $("checkBtn").onclick=check;
  input.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); answered?render():check(); } };
}

/* ============ CONTROLS ============ */
document.querySelectorAll(".chip").forEach(ch=>{
  ch.onclick=()=>{
    document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
    ch.setAttribute("aria-pressed","true");
    mode=ch.dataset.mode; render();
  };
});
const sel=$("topic");
sel.innerHTML=`<option value="all">All six topics (81 terms)</option>`+
  Object.entries(TOPICS).map(([k,v])=>`<option value="${k}">${v} (${VOCAB.filter(c=>c.tp===k).length})</option>`).join("");
sel.onchange=()=>{ topic=sel.value; lastId=null; render(); };

$("themebtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
  document.documentElement.setAttribute("data-theme", dark?"light":"dark");
  $("themebtn").textContent = dark?"Dark":"Light";
  try{ localStorage.setItem(KEY+"-theme", dark?"light":"dark"); }catch(e){}
};
try{ const th=localStorage.getItem(KEY+"-theme");
  if(th){ document.documentElement.setAttribute("data-theme",th); $("themebtn").textContent = th==="light"?"Dark":"Light"; }
}catch(e){}

const dlg=$("retDlg");
$("showRetired").onclick=()=>{
  const ret=VOCAB.filter(c=>rec(c.n).ret);
  const ul=$("retList");
  ul.innerHTML = ret.length? "" : `<li style="border:none;color:var(--muted)">Nothing retired yet. Three correct answers in a row retires a term.</li>`;
  ret.forEach(c=>{
    const li=document.createElement("li");
    li.innerHTML=`<span>#${c.n} ${c.t}</span>`;
    const b=document.createElement("button");
    b.className="link"; b.textContent="Bring back";
    b.onclick=()=>{ const r=rec(c.n); r.ret=false; r.s=0; save(); li.remove(); paintRail(); };
    li.appendChild(b); ul.appendChild(li);
  });
  dlg.showModal();
};
$("bringAll").onclick=()=>{ VOCAB.forEach(c=>{ const r=rec(c.n); r.ret=false; r.s=0; }); save(); dlg.close(); render(); };
$("closeDlg").onclick=()=>{ dlg.close(); render(); };
$("resetBtn").onclick=()=>{
  if(confirm("Erase all progress and start over with all 81 terms?")){ P={}; save(); lastId=null; render(); }
};

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(mode==="flip"){
    if(e.code==="Space"&&!flipped){ e.preventDefault(); $("flipBtn")?.click(); }
    else if(flipped&&e.key==="1"){ $("noBtn")?.click(); }
    else if(flipped&&e.key==="2"){ $("yesBtn")?.click(); }
  }
});

render();
</script>
</body>
</html>
